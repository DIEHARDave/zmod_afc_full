# Zmod AFC Full: AFC-Klipper-Add-On with an AFC unit of its own in place of the
# IFS: BoxTurtle (AFC-Lite / AFC-Pro), NightOwl, QuattroBox, HTLF, ViViD, ...
# zmod_afc_full.py includes this file instead of ad5x_afc.cfg when
# mod_data/afc_unit.cfg exists (and includes that file after it).
#
# mod_data/afc_unit.cfg holds the unit: its [mcu] (serial: /dev/serial/by-id/...,
# USB), its unit/lane/hub sections, from AFC's templates/ and config/mcu/.
# Build the unit's MCU firmware from the Klipper version Zmod runs.
#
# AFC moves the filament. AFC_FF.py turns the AD5X's analog head
# sensor into AFC's toolhead sensor; Zmod's macros cut, park, purge and wipe.
# With no IFS on /dev/ttyS4 Zmod leaves the print's T<n> to AFC.
# To change an option, add the same section with your option to
# mod_data/user.cfg; yours wins.

[AFC]
VarFile: /usr/data/config/mod_data/AFC/AFC.var
default_material_temps: default: 220, PLA:220, PETG:240, ABS:250, ASA:250, TPU:230
z_hop: 0
# G28 before a tool load or unload when not homed
auto_home: True
tool_cut: True
tool_cut_cmd: _AFC_FF_CUT
park: True
park_cmd: _AFC_FF_PARK
poop: True
poop_cmd: _AFC_FF_POOP
wipe: True
wipe_cmd: _AFC_FF_WIPE
kick: False
form_tip: False

[AFC_prep]
enable: True

[delayed_gcode afc_welcome]
initial_duration: 2
gcode:
    PREP

# Must be before [AFC_extruder]
[AFC_FF]
firmware: zmod
# Zmod's own head sensor pauses on runout; AFC owns runout now
disable_sensors: filament_switch_sensor head_switch_sensor

[AFC_extruder extruder]
u1_filament_sensor_name: ff_head
# Head sensor to nozzle: measure on your printer (the IFS pushes 60 mm past
# the sensor to clear the gears on unload, 12 mm fills the nozzle)
tool_stn: 72
tool_stn_unload: 60
tool_sensor_after_extruder: 0
tool_unload_speed: 25
tool_load_speed: 25

[gcode_macro _AFC_FF_CUT]
description: AD5X cutter via Zmod's _CUT_PRUTOK
gcode:
    _CUT_PRUTOK

[gcode_macro _AFC_FF_PARK]
description: Park over the AD5X purge chute via Zmod's _GOTO_TRASH
gcode:
    _GOTO_TRASH

[gcode_macro _AFC_FF_POOP]
description: Purge into the AD5X chute and drop it (Zmod's trash macros, extruder only)
gcode:
    {% set length = params.PURGE_LENGTH|default(90)|float %}
    _SBROS_TRASH_DAVIM PRUTOK=0 FILAMENT_DROP_LENGTH={length|int}
    _SBROS_TRASH

[gcode_macro _AFC_FF_WIPE]
description: Wipe on the AD5X rubber via Zmod's _CLEAR_REZINA
gcode:
    _CLEAR_REZINA

