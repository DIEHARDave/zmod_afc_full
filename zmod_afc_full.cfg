# Zmod AFC Full: the real AFC-Klipper-Add-On (AFCProject) on a Zmod AD5X, with
# the IFS (or another AFC unit) as the AFC unit. Needs the native screen off.
#
# [zmod_afc_full] must stay first: it links the AFC modules and stands
# Zmod's built-in AFC emulation (zmod_afc) down before AFC loads.
[zmod_afc_full]
# Restart Klipper once by itself when the AFC config below has to change
# (afc_unit.cfg added or removed, IFS Jacker slot count).
#restart_on_change: True

# Written by zmod_afc_full.py at every start: the IFS config, the unit config
# (mod_data/afc_unit.cfg) or nothing. To change an AFC option, add the same
# section with your option to mod_data/user.cfg; yours wins.
[include ../../AFC/zmod_afc_full_activ[e].cfg]
